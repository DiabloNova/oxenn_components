name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply non-breaking dependency security updates
        run: npm audit fix --package-lock-only
      - name: Install the audited dependency tree
        run: npm ci
      - name: Capture dependency audit and lockfile
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities}, null, 2))'
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-dependency-audit
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
      - run: npm run check:registry
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Commit the verified lockfile (one-time bootstrap)
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          node -e 'const a=require("./npm-audit.json"); const total=a.metadata?.vulnerabilities?.total; if (total !== 0) { console.error("Refusing to commit a lockfile with unresolved vulnerabilities:", total); process.exit(1); }'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The lockfile is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add audited npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
