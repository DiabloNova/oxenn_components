name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply non-breaking dependency security updates
        run: npm audit fix --package-lock-only
      - name: Capture dependency audit and lockfile
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities}, null, 2))'
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-dependency-audit
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
      - run: npm run check:registry
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

